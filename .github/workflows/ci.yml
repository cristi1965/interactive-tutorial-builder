name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install development validator dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test evidence verifier
        run: python3 -m unittest discover -s tests -v
      - name: Validate skill structure
        run: python3 scripts/validate_skill.py skills/interactive-tutorial-builder
      - name: Check repository hygiene
        run: python3 scripts/check_repository.py
